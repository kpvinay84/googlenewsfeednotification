name: Daily Google News RSS to ntfy

on:
  schedule:
    # Runs every day at (8:17 AM UTC), 01:47 PM IST delay of 7-8 hours because of Github actions (Change this cron expression if needed)
    - cron: '17 8 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" inside GitHub anytime
  repository_dispatch:
    types: [trigger-cron-job-org]

jobs:
  run-script:
    runs-on: ubuntu-latest
    # container: node:alpine // this is an additional step if you want it to run inside a light container instead of parent VM
    timeout-minutes: 5  # 👈 Automatically kills the job if it hangs for more than 5 minutes
    steps:
      - name: Pull latest code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm' # 👈 Caches your node_modules so npm i finishes in seconds

      - name: Install dependencies
        run: npm install

      - name: Run script (Retry ONLY on 503 errors)
        uses: nick-fields/retry@v3
        env:          
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_TRIGGER: ${{ github.event_name }} # 👈 Captures the exact event type like schedule, workflow_dispatch, repository_dispatch
          SCHEDULE_CRON: ${{ github.event.schedule }}   # 👈 Passes the cron string to Node.js i.e. 57 13 * * *
          DISPATCH_ACTION: ${{ github.event.action }} # 👈 Captures the action/type name ("Trigger GitHub Google News Notification Workflow") during a repository dispatch
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Wait 10 minutes (600,000 ms) between retries without charging you for idle time
          retry_delay_in_ms: 600000 
          # Only trigger a retry if your Node script triggers process.exit(53)
          retry_on_exit_code: 53
          # Executes your npm start command exactly as before
          #run: node YT-Feed-JS-Console-code.js   
          #run: npm start  # By changing it to run: npm start, GitHub Actions will look inside your package.json, find the "start" script, and execute whatever command is written there
          command: npm start
